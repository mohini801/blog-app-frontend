<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlogSpace | Register</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
  <div id="navbar"></div>

  <main class="container narrow">
    <form id="registerForm" class="card form">
      <h2>Create Account</h2>
      <p id="msg" class="msg"></p>

      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Your name" required />

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required />

      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" placeholder="Re-enter password" required />

      <button type="submit" class="btn full">Register</button>
      <p class="muted">Already have an account? <a href="login.html">Login</a></p>
    </form>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
